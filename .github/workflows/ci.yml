# shipkit's own CI. The workflows under ci/ ship *to* other repos; this one
# guards the CLI they all call, and it is the reason a broken command module or a
# malformed template workflow cannot reach an app repo.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is what CI templates use.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies and no lockfile, so there is nothing to install or cache.
      - run: npm run lint
      - run: npm test

  smoke:
    # Every command is lazily imported by the registry, so a syntax error or a bad
    # export only surfaces when that module is actually loaded. Loading all of
    # them, then scaffolding an app and validating the result against the schema,
    # is the cheapest end-to-end proof that needs no Apple credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Every command module loads and renders help
        run: |
          set -euo pipefail
          ship --help >/dev/null
          for f in src/commands/*.mjs; do
            name=$(basename "$f" .mjs)
            ship "$name" --help >/dev/null || { echo "::error file=$f::ship $name --help failed"; exit 1; }
          done
          echo "loaded $(find src/commands -maxdepth 1 -name '*.mjs' | wc -l) command modules"

      - name: Scaffold an app and validate it against the schema
        run: |
          set -euo pipefail
          ship new demo-app --dir "$RUNNER_TEMP/demo" --bundle-id com.example.demo
          for f in ship.config.json app.json eas.json store/staged/en-US.json; do
            test -f "$RUNNER_TEMP/demo/$f" || { echo "::error::scaffold missing $f"; exit 1; }
          done
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false \
            -s schema/ship.config.schema.json -d "$RUNNER_TEMP/demo/ship.config.json"

      - name: The design pipeline runs end to end over the scaffold
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -euo pipefail
          # A fresh scaffold has no design/system.json: `ship new` deliberately never
          # writes one, because choosing a hue is the one thing an author must do.
          # This stands in for that human step so the smoke test has something to
          # check against — shipkit does not ship a palette into app repos.
          node -e '
            import("file://'"$GITHUB_WORKSPACE"'/src/lib/design-tokens.mjs").then(m => {
              require("fs").writeFileSync("design/system.json", JSON.stringify(m.DEFAULT_SYSTEM, null, "\t"));
            });
          '
          node "$GITHUB_WORKSPACE/bin/ship" design system --check
          # The scaffold does not ship a design/ux.json either; stand in with the
          # same default spec shipkit uses to render the scaffold's own screen.
          node -e '
            import("file://'"$GITHUB_WORKSPACE"'/src/lib/design-support.mjs").then(m => {
              require("fs").writeFileSync("design/ux.json", JSON.stringify(m.DEFAULT_SPEC, null, "\t"));
            });
          '
          node "$GITHUB_WORKSPACE/bin/ship" design build
          node "$GITHUB_WORKSPACE/bin/ship" design review
          # Run build again: a generator that varied its own output would refuse to
          # overwrite its own files on the second pass. This is the cheapest possible
          # proof that the hash mechanism holds end to end.
          node "$GITHUB_WORKSPACE/bin/ship" design build

      - name: The generated TypeScript compiles under strict
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -euo pipefail
          # Nothing else compiles what the emitters write. shipkit is JSDoc-typed
          # .mjs and the app is TypeScript, where JSDoc types are ignored, so an
          # emitter that drops an annotation ships implicit-any into every app.
          # The scaffold's own tsconfig extends expo/tsconfig.base, and its screens
          # and hand-written modules import react-native — neither is installed
          # here. So this names the four generated modules that import nothing and
          # compiles them under the same `strict` the app sets for itself.
          node -e '
            require("fs").writeFileSync("tsconfig.gen.json", JSON.stringify({
              compilerOptions: {
                strict: true, noEmit: true, target: "ES2022", lib: ["ES2023"],
                module: "esnext", moduleResolution: "bundler", skipLibCheck: true,
              },
              files: [
                "src/theme/tokens.ts", "src/theme/qa-params.ts",
                "src/analytics/events.ts", "src/purchases/catalog.ts",
              ],
            }));
          '
          # This job installs nothing, so tsc comes from the registry the same way
          # ajv-cli does above. --package is required: the package is `typescript`
          # and the binary is `tsc`, and npx reads a bare trailing `tsc` as a source
          # file rather than the command.
          npx --yes --package=typescript@7 -- tsc -p tsconfig.gen.json
          rm tsconfig.gen.json

      - name: The listing gate fires, and clears once the listing is real
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -euo pipefail
          # Everything here is offline: `meta stage` lints and writes local files,
          # so it proves the gate without any Apple credentials. A fresh scaffold
          # has an empty listing and MUST be refused.
          if ship meta stage --dry-run; then
            echo "::error::meta stage accepted an empty listing"; exit 1
          fi
          node -e '
            const f = "store/staged/en-US.json";
            const j = JSON.parse(require("fs").readFileSync(f, "utf8"));
            Object.assign(j, {
              name: "Demo App",
              subtitle: "CI fixture listing",
              keywords: "demo,fixture,ci",
              description: "A scaffolded app used only to prove the pipeline works.",
              supportUrl: "https://example.com/support",
              privacyPolicyUrl: "https://example.com/privacy",
            });
            delete j.notes;
            require("fs").writeFileSync(f, JSON.stringify(j, null, "\t"));
          '
          ship meta stage --dry-run
          test ! -e store/version || { echo "::error::--dry-run wrote files"; exit 1; }

  workflows:
    # The templates under ci/ are shipped artifacts. Nothing else parses them, so
    # a typo there is only discovered by an app repo at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          set -euo pipefail
          # ubuntu-latest ships shellcheck, and actionlint shells out to it, so
          # every `run:` body in every template is shell-linted here too.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/*.yml ci/*.yml
