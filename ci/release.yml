# Gated App Store release. Copy to <repo>/.github/workflows/release.yml.
#
# Runs on ubuntu: every step is either `asc` (pure HTTP against App Store Connect)
# or an EAS cloud build. No macOS runner minutes are burned, because nothing here
# needs Xcode.
#
# The body is one `ship release` call on purpose. That command already chains
# preflight → meta stage → meta apply → build → submit and aborts on the first
# failure; re-expanding the chain into separate workflow steps means two
# implementations of the same gating, and the workflow copy is the one that
# quietly drifts (the previous version of this file skipped `meta stage`).
#
# Approval, not dry-run-by-default, is the safety here: `dry_run` still exists for
# rehearsal, but a real release goes through the `production` environment, so a
# reviewer approves it once instead of every operator paying for two runs.
# Create it with: gh api -X PUT repos/:owner/:repo/environments/production
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (blank = read from app.json)
        required: false
      from:
        description: Resume the chain at this step
        type: choice
        default: preflight
        options: [preflight, meta, build, submit]
      skip_build:
        description: Reuse the latest existing build instead of building
        type: boolean
        default: false
      dry_run:
        description: Plan every mutation, apply none
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Dry runs need no approval; real ones do.
    environment: ${{ inputs.dry_run && 'rehearsal' || 'production' }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      REVENUECAT_V2_KEY: ${{ secrets.REVENUECAT_V2_KEY }}
      # Never interpolate ${{ inputs.* }} into a run body: a dispatch input is
      # attacker-controlled text and would execute with these credentials in env.
      VERSION: ${{ inputs.version }}
      FROM: ${{ inputs.from }}
      SKIP_BUILD: ${{ inputs.skip_build }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      # Mutable ref, pinned to the default branch. Pin to a commit SHA for
      # reproducible releases once a release cadence exists.
      - uses: orangutanger1/shipkit/.github/actions/setup@master
        with:
          asc-version: ${{ vars.ASC_VERSION }}

      - name: Authenticate App Store Connect
        run: asc auth status --validate --output json

      - name: Doctor
        # pipefail: without it a failing gate exits non-zero into tee, which
        # exits zero, and the doctor can never fail this workflow.
        run: |
          set -euo pipefail
          ship doctor --json | tee "$RUNNER_TEMP/doctor.json"

      - name: Release
        run: |
          set -euo pipefail
          ARGS=(--from "$FROM")
          # `[ ... ] && ARGS+=(...)` would abort the step under `set -e` whenever
          # the test is false, because the AND-list itself exits non-zero.
          if [ -n "$VERSION" ]; then ARGS+=(--version "$VERSION"); fi
          if [ "$SKIP_BUILD" = "true" ]; then ARGS+=(--skip-build); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          ship release "${ARGS[@]}"

      - name: Status
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Review status"
            echo
            echo '```'
            ship status || echo "(status unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-reports
          path: |
            .asc/reports/
            ${{ runner.temp }}/doctor.json
          retention-days: 30
          if-no-files-found: ignore
